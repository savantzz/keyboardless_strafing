<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keyboardless Strafing Trainer</title>
<link rel="stylesheet" href="src/style.css" />
<link rel="icon" href="data:," />
</head>
<body>
  <div id="stage">
    <canvas id="trace"></canvas>
    <div id="lockHint">Click to lock the mouse and start.</div>
  </div>

  <button id="settingsToggle" title="Settings" aria-label="Settings">&#9881;</button>

  <div id="panel">
    <h1>Settings</h1>

    <fieldset>
      <legend>Movement</legend>
      <div class="field">
        <label for="initialVelocity">initial speed (u/s)</label>
        <input id="initialVelocity" type="range" min="0" max="3500" step="1" value="260" />
        <input id="initialVelocityNum" class="num" type="number" step="1" value="260" />
      </div>
      <div class="field">
        <label for="tickRate">tickrate</label>
        <input id="tickRate" type="range" min="32" max="128" step="0.001" value="66.667" />
        <input id="tickRateNum" class="num" type="number" step="0.001" value="66.667" />
      </div>
      <div class="presets" id="tickRatePresets">
        <button type="button" data-value="64">64</button>
        <button type="button" data-value="66.667">66.667</button>
        <button type="button" data-value="100.4">100.4</button>
        <button type="button" data-value="128">128</button>
      </div>
      <div class="field">
        <label for="airAccelerate">sv_airaccelerate</label>
        <input id="airAccelerate" type="range" min="0" max="1000" step="1" value="150" />
        <input id="airAccelerateNum" class="num" type="number" step="1" value="150" />
      </div>
      <div class="field">
        <label for="groundMaxSpeed">sv_maxspeed</label>
        <input id="groundMaxSpeed" type="range" min="100" max="400" step="1" value="320" />
        <input id="groundMaxSpeedNum" class="num" type="number" step="1" value="320" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Mouse</legend>
      <div class="field">
        <label for="sensitivity">sensitivity</label>
        <input id="sensitivity" type="range" min="0.01" max="10" step="0.01" value="0.7" />
        <input id="sensitivityNum" class="num" type="number" step="0.01" value="0.7" />
      </div>
      <div class="field">
        <label for="mYaw">m_yaw</label>
        <input id="mYaw" type="range" min="0.001" max="0.05" step="0.001" value="0.022" />
        <input id="mYawNum" class="num" type="number" step="0.001" value="0.022" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Display</legend>
      <div class="field">
        <label for="averagingWindow">averaging window (ticks)</label>
        <input id="averagingWindow" type="range" min="1" max="60" step="1" value="10" />
        <input id="averagingWindowNum" class="num" type="number" step="1" value="10" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Air-accel penalties</legend>
      <div class="field"><label for="penaltyCrouch">crouch (+duck)</label><input id="penaltyCrouch" type="checkbox" /></div>
      <div class="field"><label for="penaltyWalk">walk (+speed)</label><input id="penaltyWalk" type="checkbox" /></div>
      <div class="field"><label for="penaltyZ">z-vel 0-140 u/s</label><input id="penaltyZ" type="checkbox" /></div>
      <div class="field"><label for="penaltyMoveup">+moveup/+movedown</label><input id="penaltyMoveup" type="checkbox" /></div>
    </fieldset>

    <button id="resetBtn">Reset</button>
    <button id="restoreDefaultsBtn">Restore defaults</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
