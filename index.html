<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keyboardless Strafing Trainer</title>
<link rel="stylesheet" href="src/style.css" />
<link rel="icon" href="data:," />
</head>
<body>
  <div id="panel">
    <h1>Strafing Trainer</h1>

    <fieldset>
      <legend>Movement</legend>
      <div class="field">
        <label for="initialVelocity">initial speed (u/s)</label>
        <input id="initialVelocity" type="range" min="0" max="3500" step="1" value="1600" />
        <output id="initialVelocityOut"></output>
      </div>
      <div class="field">
        <label for="tickRate">tickrate</label>
        <input id="tickRate" type="range" min="32" max="128" step="0.01" value="66.67" />
        <output id="tickRateOut"></output>
      </div>
      <div class="field">
        <label for="airAccelerate">sv_airaccelerate</label>
        <input id="airAccelerate" type="range" min="0" max="1000" step="1" value="150" />
        <output id="airAccelerateOut"></output>
      </div>
      <div class="field">
        <label for="groundMaxSpeed">sv_maxspeed</label>
        <input id="groundMaxSpeed" type="range" min="100" max="400" step="1" value="260" />
        <output id="groundMaxSpeedOut"></output>
      </div>
    </fieldset>

    <fieldset>
      <legend>Mouse</legend>
      <div class="field">
        <label for="sensitivity">sensitivity</label>
        <input id="sensitivity" type="range" min="0.1" max="10" step="0.01" value="3" />
        <output id="sensitivityOut"></output>
      </div>
      <div class="field">
        <label for="mYaw">m_yaw</label>
        <input id="mYaw" type="range" min="0.001" max="0.05" step="0.001" value="0.022" />
        <output id="mYawOut"></output>
      </div>
      <div class="field">
        <label for="tolerance">target tolerance (deg)</label>
        <input id="tolerance" type="range" min="0.1" max="10" step="0.1" value="2" />
        <output id="toleranceOut"></output>
      </div>
    </fieldset>

    <fieldset>
      <legend>Air-accel penalties</legend>
      <div class="field"><label for="penaltyCrouch">crouch (+duck)</label><input id="penaltyCrouch" type="checkbox" /></div>
      <div class="field"><label for="penaltyWalk">walk (+speed)</label><input id="penaltyWalk" type="checkbox" /></div>
      <div class="field"><label for="penaltyZ">z-vel 0-140 u/s</label><input id="penaltyZ" type="checkbox" /></div>
      <div class="field"><label for="penaltyMoveup">+moveup/+movedown</label><input id="penaltyMoveup" type="checkbox" /></div>
    </fieldset>

    <button id="resetBtn">Reset</button>
  </div>

  <div id="stage">
    <canvas id="gauge" width="480" height="480"></canvas>
  </div>
  <div id="lockHint">Click the gauge to lock the pointer and start strafing.</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
